pid /run/nginx/nginx.pid;
thread_pool default threads=4 max_queue=256;
error_log stderr crit;
# leave stderr open but minimize duplicate logging to it

worker_processes auto;
worker_rlimit_nofile 16384;
worker_shutdown_timeout 1h;

events {
    worker_connections 4096;
}

http {
    # Never persist request-associated error details or client addresses.
    error_log /dev/null crit;
    root /var/empty;

    include mime.types;
    default_type application/octet-stream;

    charset utf-8;
    charset_types text/css text/javascript text/plain text/xml application/atom+xml;

    sendfile on;
    sendfile_max_chunk 256k;
    tcp_nopush on;
    keepalive_requests 10000;
    keepalive_timeout 0;
    server_tokens off;
    msie_padding off;

    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    http2_chunk_size 4k;

    reset_timedout_connection on;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    max_headers 50;
    max_ranges 1;

    resolver 127.0.0.53;
    resolver_timeout 15s;

    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    http2_max_concurrent_streams 16;
    limit_conn_status 429;
    limit_conn_zone $binary_remote_addr zone=http-limit:10m;
    limit_conn http-limit 128;
    limit_req_status 429;
    limit_req_zone $post_binary_remote_addr zone=backend-limit:10m rate=256r/s;
    limit_req_zone $post_binary_remote_addr zone=auth-limit:10m rate=1r/s;

    ssl_buffer_size 4k;
    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_conf_command Options PrioritizeChaCha;
    ssl_conf_command SignatureAlgorithms ECDSA+SHA256:ECDSA+SHA384:ECDSA+SHA512;
    ssl_certificate_compression on;

    # managed externally in noswap tmpfs
    ssl_session_ticket_key /etc/tls/session-ticket-keys/4.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/3.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/2.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/1.key;
    ssl_session_ticket_key /etc/tls/session-ticket-keys/next.key;
    ssl_session_timeout 1d;

    ssl_certificate /etc/letsencrypt/live/diamaneos-attestation/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamaneos-attestation/privkey.pem;

    access_log off;
    log_subrequest off;
    log_not_found off;

    gzip_proxied any;
    gzip_vary on;

    if_modified_since before;

    aio threads;
    aio_write on;

    map $request_method $post_binary_remote_addr {
        POST $binary_remote_addr;
    }


    map $uri $preload_resources_uri {
        /index.html ", <{{path|/monitoring.js}}>; rel=modulepreload; integrity={{integrity|/monitoring.js}}";
    }

    upstream backend {
        zone backend 32k;
        server [::1]:8080 max_conns=1024 max_fails=0;
        keepalive 32;
    }

    server {
        listen 80 default_server backlog=4096 fastopen=16 rcvbuf=2048 sndbuf=2048;
        listen [::]:80 default_server backlog=4096 fastopen=16 rcvbuf=2048 sndbuf=2048;

        # https://trac.nginx.org/nginx/ticket/2012
        location / {
            return 421;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name attestation.diamaneos.de;

        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt/webroot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 default_server ssl backlog=4096 fastopen=16;
        listen [::]:443 default_server ssl backlog=4096 fastopen=16;
        http2 on;
        ssl_reject_handshake on;

        # https://trac.nginx.org/nginx/ticket/2012
        location / {
            return 421;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name attestation.diamaneos.de;

        include service-state.conf;

        include root_attestation.diamaneos.de.conf;
        error_page 403 =404 /404;
        error_page 404 405 /404;

        keepalive_timeout 3m;

        open_file_cache max=2048 inactive=1d;
        open_file_cache_valid 1d;

        include security-headers.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        gzip_static on;

        if ($request_uri ~ ^[^?]*//) {
            rewrite ^(.*)$ $1 permanent;
        }

        location = /security.txt { return 404; }
        location = /.well-known/security.txt { return 404; }
        location ^~ /allowed_signers { return 404; }
        location ^~ /donate { return 404; }
        location ^~ /bitcoin- { return 404; }
        location ^~ /monero- { return 404; }
        location ^~ /contact { return 404; }

        location = /ic_launcher-web.png {
            return 301 /opengraph.png;
        }

        location = /privacy_policy {
            return 301 /privacy-policy;
        }

        location = /404 {
            internal;
            include security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            include preload.conf;
            try_files $uri.html =404;
        }

        location = /manifest.webmanifest {
            include security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=604800";
        }

        location = /favicon.ico {
            if ($http_accept ~ "image/svg\+xml") {
                rewrite ^ /favicon.svg last;
            }
            include security-headers.conf;
            # avoid breaking image hotlinking such as https://github.com/TryGhost/Ghost/issues/12880
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "public, max-age=604800";
        }

        location = /favicon.svg {
            include security-headers.conf;
            # avoid breaking image hotlinking such as https://github.com/TryGhost/Ghost/issues/12880
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "public, max-age=604800";
        }

        location = /.well-known/traffic-advice {
            default_type application/trafficadvice+json;
        }

        location = /placeholder.gif {
            include security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            gzip_static off;
        }

        location = /auditor/challenge {
            if ($request_method != POST) {
                return 405;
            }
            proxy_pass http://backend;
            limit_req zone=backend-limit burst=32 nodelay;
            max_ranges 0;
        }

        location = /auditor/verify {
            if ($request_method != POST) {
                return 405;
            }
            client_max_body_size 4k;
            client_body_buffer_size 4k;
            proxy_pass http://backend;
            limit_req zone=backend-limit burst=32 nodelay;
            max_ranges 0;
        }

        location = /submit {
            return 410;
        }

        location = /challenge {
            return 410;
        }

        location = /verify {
            return 410;
        }

        location = /api/create-account {
            if ($request_method != POST) {
                return 405;
            }
            proxy_pass http://backend;
            limit_req zone=backend-limit burst=32 nodelay;
            limit_req zone=auth-limit burst=10 nodelay;
            max_ranges 0;
        }

        location = /api/login {
            if ($request_method != POST) {
                return 405;
            }
            proxy_pass http://backend;
            limit_req zone=backend-limit burst=32 nodelay;
            limit_req zone=auth-limit burst=10 nodelay;
            max_ranges 0;
        }

        location ^~ /api/ {
            if ($request_method != POST) {
                return 405;
            }
            gzip on;
            gzip_min_length 256;
            gzip_types application/json;
            proxy_pass http://backend;
            limit_req zone=backend-limit burst=32 nodelay;
            max_ranges 0;
        }

        location ^~ /fonts/ {
            include security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            gzip_static off;
        }

        location ~ "/$" {
            if ($request_uri ~ \?) {
                rewrite ^(.*)$ $1? permanent;
            }
            include security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, no-cache";
            include preload.conf;
            try_files ${uri}index.html @noslash;
        }

        # redirect /path/ to /path if /path.html exists
        location @noslash {
            rewrite ^(.*)/$ $1;
            if (-f $request_filename.html) {
                rewrite ^(.*) $1 permanent;
            }
            return 404;
        }

        location ~ "\.(?:css|js)$" {
            include security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ "\.svg$" {
            include security-headers.conf;
            # avoid breaking image hotlinking such as https://github.com/TryGhost/Ghost/issues/12880
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "public, max-age=31536000";
        }

        location ~ "\.png$" {
            include security-headers.conf;
            # avoid breaking image hotlinking such as https://github.com/TryGhost/Ghost/issues/12880
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "public, max-age=31536000";
            gzip_static off;
        }

        location ~ "\.(?:json|txt|xml)$" {
            include security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=1800";
        }

        location ~ "/index|\.(?:br|gz|html)$" {
            internal;
        }

        location / {
            if ($request_uri ~ \?) {
                rewrite ^(.*)$ $1? permanent;
            }
            include security-headers.conf;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, no-cache";
            include preload.conf;
            try_files $uri.html $uri/ =404;
        }
    }

    server {
        listen unix:/run/nginx/status.sock;

        access_log off;

        location = / {
            stub_status;
        }

        location / {
            return 404;
        }
    }
}
